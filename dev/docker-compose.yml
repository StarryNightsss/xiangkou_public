services:
  mysql:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password --sql-mode=NO_ENGINE_SUBSTITUTION
    environment:
      MYSQL_ROOT_PASSWORD: xiangkou_local_only
      MYSQL_DATABASE: xiangkou
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./02-seed-data.sql:/docker-entrypoint-initdb.d/02-seed-data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -pxiangkou_local_only --silent"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # 业务后端：Go（业务后端），与 Agent 侧通过 HTTP 契约对接。
  go-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.go
    environment:
      PORT: "8081"
      MYSQL_DSN: root:xiangkou_local_only@tcp(mysql:3306)/xiangkou?parseTime=true&charset=utf8mb4&loc=Local
      REDIS_ADDR: redis:6379
      UPLOAD_DIR: /uploads
      XIANGKOU_PAYMENT_MOCK_ENABLED: "true"
      XIANGKOU_CATALOG_ADMIN_IDS: "1010,1012"
      SHOP_CACHE_TTL_SECONDS: "1800"
      RECONCILE_INTERVAL_SECONDS: "30"
      # 与 Python 侧共用 dev/.env 里的发件邮箱；未配置时验证码只写 Redis
      SPRING_MAIL_USERNAME: "${SPRING_MAIL_USERNAME:-}"
      SPRING_MAIL_PASSWORD: "${SPRING_MAIL_PASSWORD:-}"
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      # 上传的图片直接落到 nginx 的站点目录，/imgs/... 可直接服务
      - ../nginx-html/imgs:/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    image: nginx:alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ../nginx-html:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - go-api

volumes:
  mysql-data:
  redis-data:
