# 生产编排：只有 app 对外暴露（默认只绑本机，由 Caddy 反代）
# 用法：cp deploy/.env.example deploy/.env && 填值 && docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build
name: xiangkou

services:
  mysql:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password --sql-mode=NO_ENGINE_SUBSTITUTION
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?需要在 deploy/.env 里设置}
      MYSQL_DATABASE: xiangkou
    volumes:
      - mysql-data:/var/lib/mysql
      - ../dev/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../dev/02-seed-data.sql:/docker-entrypoint-initdb.d/02-seed-data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 40
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?需要在 deploy/.env 里设置}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  go-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.go
    image: ${GO_IMAGE:-xiangkou-go:local}
    environment:
      PORT: "8081"
      MYSQL_DSN: root:${MYSQL_ROOT_PASSWORD:?}@tcp(mysql:3306)/xiangkou?parseTime=true&charset=utf8mb4&loc=Local
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
      UPLOAD_DIR: /uploads
      XIANGKOU_PAYMENT_MOCK_ENABLED: "true"
      XIANGKOU_CATALOG_ADMIN_IDS: ${XIANGKOU_CATALOG_ADMIN_IDS:-1010,1012}
    volumes:
      - uploads:/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.app
    image: ${APP_IMAGE:-xiangkou-app:local}
    environment:
      DIANPING_BASE_URL: http://go-api:8081
      DIANPING_WEB_URL: ${PUBLIC_BASE_URL:-http://127.0.0.1:8090}
      XIANGKOU_DATA_PATH: /data/xiangkou.sqlite3
      XIANGKOU_LLM_PROVIDER: ${XIANGKOU_LLM_PROVIDER:-anthropic}
      XIANGKOU_LLM_API_KEY: ${XIANGKOU_LLM_API_KEY:-}
      XIANGKOU_LLM_MODEL: ${XIANGKOU_LLM_MODEL:-}
      XIANGKOU_LLM_BASE_URL: ${XIANGKOU_LLM_BASE_URL:-}
      XIANGKOU_CATALOG_ADMIN_IDS: ${XIANGKOU_CATALOG_ADMIN_IDS:-}
      XIANGKOU_IMAGES_DIR: /uploads
    volumes:
      - app-data:/data
      - uploads:/uploads:ro
    ports:
      - "127.0.0.1:${APP_PORT:-8090}:8090"
    depends_on:
      - go-api
    restart: unless-stopped

  # 需要 HTTPS 时启用：docker compose --profile tls up -d
  caddy:
    image: caddy:2-alpine
    profiles: ["tls"]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - uploads:/srv/imgs:ro
    depends_on:
      - app
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  app-data:
  uploads:
  caddy-data:
