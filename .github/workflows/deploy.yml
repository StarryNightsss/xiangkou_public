name: Deploy

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    name: Build and push images
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.meta.outputs.app }}
      go: ${{ steps.meta.outputs.go }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        name: Compose image names
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          repo=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          echo "app=ghcr.io/${owner}/${repo}-app:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "go=ghcr.io/${owner}/${repo}-go:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "app_latest=ghcr.io/${owner}/${repo}-app:latest" >> "$GITHUB_OUTPUT"
          echo "go_latest=ghcr.io/${owner}/${repo}-go:latest" >> "$GITHUB_OUTPUT"

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.app
          push: true
          tags: |
            ${{ steps.meta.outputs.app }}
            ${{ steps.meta.outputs.app_latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push go image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.go
          push: true
          tags: |
            ${{ steps.meta.outputs.go }}
            ${{ steps.meta.outputs.go_latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to server
    needs: images
    # 没配服务器时自动跳过：仓库 Settings → Variables 里设 DEPLOY_ENABLED=true 才执行
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Copy compose files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "deploy/docker-compose.prod.yml,deploy/Caddyfile"
          target: "~/xiangkou"

      - name: Pull images and restart
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_IMAGE: ${{ needs.images.outputs.app }}
          GO_IMAGE: ${{ needs.images.outputs.go }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: APP_IMAGE,GO_IMAGE
          script: |
            set -e
            cd ~/xiangkou/deploy
            export APP_IMAGE GO_IMAGE
            docker compose -f docker-compose.prod.yml --env-file .env pull
            docker compose -f docker-compose.prod.yml --env-file .env up -d --remove-orphans
            docker compose -f docker-compose.prod.yml --env-file .env ps

      - name: Smoke test public endpoint
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "https://${{ vars.PUBLIC_HOST }}/health" > /dev/null; then
              echo "healthy"; exit 0
            fi
            sleep 5
          done
          echo "health check failed"; exit 1
