name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python / pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run tests
        run: python -m pytest tests -q

  frontend:
    name: Frontend / build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Type check and build
        run: npm run build

  go:
    name: Go / vet + build + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: go-service/go.sum
      - name: Vet
        run: go vet ./...
      - name: Build
        run: CGO_ENABLED=0 go build ./...
      - name: Test
        run: go test -race ./...

  compose:
    name: Compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose -f dev/docker-compose.yml config > /dev/null

  images:
    name: Build images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.app
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build go image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.go
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: Publish images (GHCR)
    # 只在 main 分支 push 时推送镜像；PR 只构建不推。
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Lowercase image name
        id: name
        run: echo "repo=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.app
          push: true
          tags: |
            ghcr.io/${{ steps.name.outputs.repo }}-app:latest
            ghcr.io/${{ steps.name.outputs.repo }}-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Push go image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.go
          push: true
          tags: |
            ghcr.io/${{ steps.name.outputs.repo }}-go:latest
            ghcr.io/${{ steps.name.outputs.repo }}-go:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max